<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions, oppgave 2</title>
</head>
<body>
    
    <script>
        const people = ["Marius", "Tore", "Susanne", "Monica", "Arne", "Zoltan", "Beate"]

        function printNames (array) {
            //Sortere arrayen alfabetisk
            array.sort()
            //Lage en ny ul-tag
            const ul = document.createElement("ul")
            //Fylle ul-listen med listelementer med navn
            array.map(person => {
                //Lage en <Li> (Listelement)
                    const li = document.createElement("li")
                //Få navnet i "person" parameteren inn i <li>
                    li.innerHTML = person
                //Legge <li> elementet inn i <ul>
                    ul.appendChild(li)
                //Legge <ul> listen på nettsiden:
                    document.body.appendChild(ul)
                    
            })

            //Testutskrift
            console.log(ul)
            
        }
        //Kjøre funksjonen
        printNames(people)

        
    </script>
</body>
</html>
